<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0e14" />
<title>Universe</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --panel: #131826; --panel-2: #1b2335; --line: #273149;
    --txt: #e6ebf5; --muted: #8b96ad; --accent: #6ea8fe; --accent-2: #7ee0c0;
    --registry: #c79bff; --warn: #ffb86b; --danger: #ff7a7a; --ok: #46d17f;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }
  button { font: inherit; }

  /* ---- generic chrome ---- */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 12px) 16px 12px;
    background: linear-gradient(180deg, rgba(11,14,20,.96), rgba(11,14,20,.7)); z-index: 6; }
  .bar .title { font-weight: 800; letter-spacing: .3px; font-size: 17px; }
  .bar .spacer { flex: 1; }
  .btn { background: var(--panel); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: 9px 14px; font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    min-height: 42px; justify-content: center; }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: #1b2f57; border-color: #2f4d86; color: #cfe0ff; }
  .btn.danger { background: #3a1d23; border-color: #7a3340; color: #ff9a9a; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.icon { width: 42px; padding: 9px 8px; font-size: 18px; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font-size: 12.5px; color: var(--muted); display: inline-flex;
    align-items: center; gap: 6px; }
  .badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    padding: 3px 9px; border-radius: 999px; }
  .badge.running { background: rgba(70,209,127,.16); color: var(--ok); }
  .badge.paused  { background: rgba(255,184,107,.16); color: var(--warn); }
  .badge.done    { background: rgba(139,150,173,.16); color: var(--muted); }
  .badge.crashed { background: rgba(255,122,122,.16); color: var(--danger); }
  .badge.queued  { background: rgba(110,168,254,.16); color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.replay { background: var(--warn); }

  /* ---- index (runs gallery) ---- */
  #index { flex: 1; overflow-y: auto; padding: 4px 16px calc(var(--safe-b) + 24px);
    -webkit-overflow-scrolling: touch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 9px; }
  .card:active { transform: scale(.99); }
  .card .idline { display: flex; align-items: center; gap: 8px; }
  .card .rid { font-weight: 700; font-size: 14px; word-break: break-all; flex: 1; }
  .card .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 5px 12px; }
  .card .agents { display: flex; flex-wrap: wrap; gap: 5px; }
  .tagchip { font-size: 11px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px 8px; color: var(--accent); }
  .empty-note { color: var(--muted); text-align: center; padding: 60px 20px; line-height: 1.6; }

  /* ---- run view ---- */
  #runView { flex: 1; position: relative; display: none; }
  #runView.show { display: block; }
  #cy { position: absolute; inset: 0; }
  #runView.trajectory #cy, #runView.trajectory #transport, #runView.trajectory #legend { display: none; }
  #runState { font-weight: 800; text-transform: capitalize; }
  #runState.run-running { color: var(--ok); } #runState.run-paused { color: var(--warn); }
  #runState.run-stopped { color: var(--danger); }
  .segwrap { display: flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; overflow: hidden; }
  .seg { padding: 8px 14px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg.on { background: var(--panel-2); color: var(--txt); }

  #legend { position: absolute; left: 16px; bottom: calc(var(--safe-b) + 84px); z-index: 4;
    display: flex; gap: 12px; font-size: 11px; color: var(--muted);
    background: rgba(19,24,38,.7); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px; backdrop-filter: blur(6px); }
  #legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }

  #transport { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 14px calc(var(--safe-b) + 12px);
    background: linear-gradient(0deg, rgba(11,14,20,.94), rgba(11,14,20,0));
    display: flex; align-items: center; gap: 10px; }
  #scrub { flex: 1; accent-color: var(--accent); height: 24px; min-width: 60px; }
  #stepLabel { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted);
    min-width: 52px; text-align: center; }

  /* ---- trajectory view ---- */
  /* Sits below the fixed run bar (padding-top clears it) so Back + the
     Graph/Trajectory toggle stay on top and clickable in trajectory mode. */
  #trajectory { position: absolute; inset: 0; display: none; flex-direction: column;
    padding-top: calc(var(--safe-t) + 66px); }
  #runView.trajectory #trajectory { display: flex; }
  /* Agent picker lives in the run bar, shown only in trajectory mode. */
  .traj-only { display: none; }
  #runView.trajectory .traj-only { display: inline-flex; }
  #agentSel { background: #0d1220; border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: 8px 10px; font: inherit; max-width: 40vw; }
  .traj-body { flex: 1; overflow-y: auto; padding: 0 14px calc(var(--safe-b) + 30px);
    -webkit-overflow-scrolling: touch; max-width: 820px; width: 100%; margin: 0 auto; }
  /* Sticky so the current step stays pinned at the top as you scroll a turn —
     you can always see which step the messages in view belong to. */
  .step-div { display: flex; align-items: center; gap: 10px; margin: 16px 2px 8px;
    position: sticky; top: 0; z-index: 3; padding: 8px 0 6px;
    background: linear-gradient(180deg, var(--bg) 62%, rgba(11,14,20,0)); cursor: pointer; }
  .step-div::before, .step-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .step-div span { color: var(--txt); font-size: 12px; font-weight: 700; letter-spacing: .4px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; }
  .step-div:active span { border-color: var(--accent); }

  /* ---- message cards ---- */
  .msg { border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; overflow: hidden; }
  .msg-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer;
    background: var(--panel-2); }
  .role { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
  .role.system { color: var(--muted); } .role.user { color: var(--accent-2); }
  .role.assistant { color: var(--accent); } .role.tool { color: var(--warn); }
  .msg-prev { flex: 1; font-size: 12px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .caret { color: var(--muted); transition: transform .2s; } .msg.open .caret { transform: rotate(90deg); }
  .msg-body { display: none; padding: 11px 13px; border-top: 1px solid var(--line);
    font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .msg.open .msg-body { display: block; }
  .reasoning { color: var(--muted); font-style: italic; border-left: 2px solid var(--line);
    padding-left: 10px; margin: 0 0 9px; white-space: pre-wrap; }
  .toolcall { background: #0d1220; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; margin: 7px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .toolcall .fn { color: var(--accent); font-weight: 700; }

  /* ---- bottom sheet (vertex inspector, from run graph) ---- */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.22,1,.36,1);
    background: var(--panel); border-top-left-radius: 20px; border-top-right-radius: 20px;
    border-top: 1px solid var(--line); box-shadow: 0 -16px 40px rgba(0,0,0,.5);
    max-height: 76vh; display: flex; flex-direction: column; padding-bottom: var(--safe-b); }
  #sheet.open { transform: translateY(0); }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 4px; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 4px 16px 10px; }
  .sheet-title { font-size: 18px; font-weight: 700; flex: 1; word-break: break-all; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .tag.agent { background: rgba(110,168,254,.16); color: var(--accent); }
  .tag.registry { background: rgba(199,155,255,.16); color: var(--registry); }
  .tag.object { background: rgba(126,224,192,.14); color: var(--accent-2); }
  .x { color: var(--muted); font-size: 24px; line-height: 1; padding: 4px 6px; cursor: pointer; }
  .tabs { display: flex; gap: 6px; padding: 0 16px 8px; }
  .tab { font-size: 13px; color: var(--muted); padding: 7px 12px; border-radius: 10px;
    border: 1px solid transparent; cursor: pointer; }
  .tab.on { color: var(--txt); background: var(--panel-2); border-color: var(--line); }
  .tab.has-err { color: var(--danger); }
  .sheet-body { overflow-y: auto; padding: 0 16px 18px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .chip.empty { color: var(--muted); border-style: dashed; cursor: default; }
  pre.state { background: #0d1220; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; overflow-x: auto; font-size: 12.5px; margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  .k { color: #9fc1ff; } .s { color: #9be7b4; } .n { color: var(--warn); }
  .b { color: #ff9ec4; } .nl { color: var(--muted); }
  pre.code { white-space: pre; color: #d7e0f5; }
  pre.err { white-space: pre-wrap; color: var(--danger); border-color: #7a3340; background: #2a1418; }
  .code-hint { color: var(--muted); font-size: 12.5px; margin: 8px 2px 2px; line-height: 1.5; }

  /* ---- modal (launcher + confirm) ---- */
  .modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.62);
    display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
  .modal.open { display: flex; }
  .modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    max-height: 88vh; overflow-y: auto; }
  .modal-card h3 { margin: 0 0 14px; font-size: 19px; }
  .modal-card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .field { margin: 0 0 13px; } .field label { display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .field input, .field select, .field textarea { width: 100%; background: #0d1220;
    border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 10px 12px;
    font: inherit; }
  .field textarea { min-height: 66px; resize: vertical; }
  .row2 { display: flex; gap: 10px; } .row2 > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--txt); font-size: 14px; }
  .check input { width: auto; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions.col { flex-direction: column; }
  .modal-actions .btn { flex: 1; }

  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 24px);
    z-index: 60; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <!-- ===== INDEX ===== -->
  <div class="bar" id="indexBar">
    <span class="title">✦ Universe</span>
    <span class="spacer"></span>
    <button class="btn" id="refreshBtn" title="refresh">⟳</button>
    <button class="btn primary" id="newBtn">＋ New experiment</button>
  </div>
  <div id="index"></div>

  <!-- ===== RUN VIEW ===== -->
  <div id="runView">
    <div class="bar" id="runBar" style="position:absolute;left:0;right:0;top:0;z-index:12;">
      <button class="btn icon" id="backBtn" title="all runs">‹</button>
      <span class="title" id="runTitle" style="font-size:14px;"></span>
      <span class="spacer"></span>
      <select id="agentSel" class="traj-only" title="agent transcript"></select>
      <div class="segwrap">
        <span class="seg on" id="segGraph">Graph</span>
        <span class="seg" id="segTraj">Trajectory</span>
      </div>
      <span id="runState" class="pill run-running hidden">running</span>
      <button id="pauseBtn" class="btn icon hidden" title="pause">⏸</button>
      <button id="stopBtn" class="btn icon hidden" title="stop" style="color:var(--danger);">⏹</button>
      <span id="conn" class="dot" title="—"></span>
    </div>

    <div id="cy"></div>
    <div id="legend">
      <span><i style="background:var(--accent)"></i>agent</span>
      <span><i style="background:var(--accent-2)"></i>object</span>
      <span><i style="background:var(--registry)"></i>registry</span>
    </div>
    <div id="transport">
      <button id="prevBtn" class="btn icon" title="previous">‹</button>
      <button id="playBtn" class="btn icon" title="play">▶</button>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1" />
      <button id="nextBtn" class="btn icon" title="next">›</button>
      <span id="stepLabel">0 / 0</span>
      <button id="liveBtn" class="btn icon on" title="follow live">◉</button>
    </div>

    <!-- trajectory (whole-run transcript; the run bar above stays fixed so Back
         and the Graph/Trajectory toggle are always reachable) -->
    <div id="trajectory">
      <div class="traj-body" id="trajBody"></div>
    </div>

    <!-- vertex sheet -->
    <div id="sheet">
      <div class="grip"></div>
      <div class="sheet-head">
        <span id="sheetTitle" class="sheet-title">vertex</span>
        <span id="sheetTag" class="tag object">object</span>
        <span id="sheetClose" class="x">×</span>
      </div>
      <div class="tabs">
        <span id="tabState" class="tab on">State</span>
        <span id="tabCode" class="tab" style="display:none;">Code</span>
        <span id="tabTrace" class="tab">Trace</span>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>
</div>

<!-- launcher modal -->
<div class="modal" id="launchModal">
  <div class="modal-card">
    <h3>New experiment</h3>
    <div class="field">
      <label>World</label>
      <select id="f_kind">
        <option value="demo">demo — model-free scripted world (no Ollama needed)</option>
        <option value="gemma">gemma — real Ollama LLM agents</option>
      </select>
    </div>
    <div class="gemma-only">
      <div class="row2">
        <div class="field"><label>Model</label><input id="f_model" value="gemma4" /></div>
        <div class="field"><label>Agents</label><input id="f_agents" type="number" min="1" value="1" /></div>
      </div>
      <div class="field"><label>Ollama URL</label><input id="f_url" value="http://127.0.0.1:11434" /></div>
      <div class="field">
        <label>Prompt level (how much the agent is told)</label>
        <select id="f_level">
          <option value="0">L0 — nothing</option>
          <option value="1">L1 — one line</option>
          <option value="2" selected>L2 — mechanics only</option>
          <option value="3">L3 — mechanics + example</option>
          <option value="4">L4 — mechanics + example + goal</option>
        </select>
      </div>
      <div class="field"><label>Custom system prompt (overrides level)</label>
        <textarea id="f_system" placeholder="leave blank to use the level above"></textarea></div>
      <div class="field"><label class="check"><input id="f_bare" type="checkbox" /> bare — only agents + registry (no objects)</label></div>
      <div class="field"><label class="check"><input id="f_continuous" type="checkbox" checked /> continuous — one running conversation across steps</label></div>
    </div>
    <div class="row2">
      <div class="field"><label>Steps (0 = unlimited)</label><input id="f_steps" type="number" min="0" value="8" /></div>
      <div class="field"><label>Delay (s/step)</label><input id="f_delay" type="number" min="0" step="0.1" value="1.0" /></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="launchCancel">Cancel</button>
      <button class="btn primary" id="launchGo">Launch ▶</button>
    </div>
  </div>
</div>

<!-- stop confirm modal -->
<div class="modal" id="confirmModal">
  <div class="modal-card">
    <h3>Stop this run?</h3>
    <p>The run halts and its final state is saved for inspection. You can still scrub
       and read its trajectory afterwards.</p>
    <div class="modal-actions col">
      <button id="confirmStop" class="btn danger">Stop run</button>
      <button id="confirmCancel" class="btn ghost">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
